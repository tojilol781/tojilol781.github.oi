    @keyframes fadeSlideDown {

      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }

      0%, 100% { translate: 0 0; }

      to   { transform: translateX(-50%); }

    .spark-fill { position: relative; }
    .spark-fill::before, .spark-fill::after {
      content: ''; position: absolute; right: -5px; top: 50%;
      width: 10px; height: 10px; margin-top: -5px; border-radius: 9999px;
      background: #fde047; box-shadow: 0 0 10px #fde047; pointer-events: none; opacity: 0;
    }
    .spark-fill::before { animation: sparkA 1.1s ease-out infinite; }
    .spark-fill::after { animation: sparkB 1.1s ease-out infinite .55s; }
    .spark-fill[style*="width: 0%"]::before, .spark-fill[style*="width: 0%"]::after { display: none; }
    @keyframes sparkA {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(18px, -16px) scale(0.2); opacity: 0; }
    }
    @keyframes sparkB {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(22px, 14px) scale(0.2); opacity: 0; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    header.header-grad { animation: fadeSlideDown 0.6s ease-out backwards; }
    .module-card { animation: popIn 0.45s ease-out backwards, floatyMove 4s ease-in-out 0.5s infinite; }

    .module-card:nth-child(2) { animation-delay: 0.12s; }
    .module-card:nth-child(3) { animation-delay: 0.19s; }
    .module-card:nth-child(4) { animation-delay: 0.26s; }

      // =========================================================================

      function loadModules() {
        try {
          const raw = localStorage.getItem(MODULES_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch {}
        return DEFAULT_MODULES;
      }

      function saveModules(list) {
        try {
          localStorage.setItem(MODULES_STORAGE_KEY, JSON.stringify(list));
        } catch {}
      }

      function loadProgress() {
        try {
          const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch {}
        return { completedIds: [], scores: {}, reflections: {} };
      }

      function saveProgress() {
        try {
          localStorage.setItem(PROGRESS_STORAGE_KEY, JSON.stringify(STATE.progress));
        } catch {}

      function showToast(title, msg = '', type = 'success') {
        const box = document.getElementById('toastContainer');
        if (!box) return;
        const styles = {
          success: 'bg-emerald-600 text-white border-emerald-400',
          info: 'bg-indigo-600 text-white border-indigo-400',
          warning: 'bg-amber-500 text-white border-amber-300',
          error: 'bg-rose-600 text-white border-rose-400'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto p-3.5 rounded-2xl shadow-xl border ${styles[type] || styles.info} animate-fade-up`;
        el.innerHTML = `
          <p class="font-bold text-sm">${escapeHtml(title)}</p>
          ${msg ? `<p class="text-xs opacity-90 mt-0.5">${escapeHtml(msg)}</p>` : ''}
        `;
        box.appendChild(el);
        setTimeout(() => el.remove(), 3600);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function normalizeYoutubeEmbed(url) {
        if (!url) return '';
        const trimmed = url.trim();
        if (trimmed.includes('youtube.com/embed/')) return trimmed;
        const watchMatch = trimmed.match(/[?&]v=([^&]+)/);
        if (watchMatch) return `https://www.youtube.com/embed/${watchMatch[1]}`;
        const shortMatch = trimmed.match(/youtu\.be\/([^?&]+)/);
        if (shortMatch) return `https://www.youtube.com/embed/${shortMatch[1]}`;
        return trimmed;
      }

            ` : `
              <button onclick="window.MicroApp.submitQuizItem()" ${STATE.selectedOption === null ? 'disabled' : ''}

          </div>

      // TAHAP 5: REFLEKSI PEMBELAJARAN
      function renderStepRefleksi(mod) {
        const savedRef = STATE.progress.reflections[mod.id] || '';
        return `
          <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-xs border border-slate-100 space-y-5 animate-fade-up">

      // TAHAP SELESAI
      function renderStepSelesai(mod) {
        const totalQ = (mod.quiz || []).length;
        const score = totalQ > 0 ? Math.round((STATE.quizCorrect / totalQ) * 100) : 100;
        const ref = STATE.progress.reflections[mod.id];

        return `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xs border border-slate-100 text-center space-y-5 animate-fade-up">

              <h2 class="text-xl font-extrabold text-slate-800 mt-2">${escapeHtml(mod.judul)}</h2>

              </button>

      // =========================================================================
      // 7. HALAMAN KHUSUS ADMIN / GURU UNTUK MENGEDIT & MENAMBAH MATERI
      // =========================================================================
      function supabaseConf() {
        return (window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
          ? { url: window.SUPABASE_URL, key: window.SUPABASE_ANON_KEY }
          : null;
      }

      async function sendNilaiRemote(mod, nama, skor, teks) {
        const sb = supabaseConf();
        if (!sb) return;
        try {
          const r = await fetch(sb.url + '/rest/v1/rpc/simpan_nilai', {
            method: 'POST',
            headers: { apikey: sb.key, Authorization: 'Bearer ' + sb.key, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_nama: nama, p_module_id: mod.id, p_judul: mod.judul, p_mapel: mod.mapel, p_skor: skor, p_teks: teks })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
        } catch (err) {
          showToast('Nilai belum terkirim', 'Periksa koneksi. Nilai tetap tersimpan di browser ini.', 'error');
        }
      }

      async function loadNilaiRemote() {
        const sb = supabaseConf();
        STATE.nilaiStatus = 'loading';
        if (!sb) { STATE.nilaiStatus = 'error'; renderApp(); return; }
        try {
          const r = await fetch(sb.url + '/rest/v1/nilai_siswa?select=nama,module_id,judul,mapel,skor,teks,updated_at&order=updated_at.desc', {
            headers: { apikey: sb.key, Authorization: 'Bearer ' + sb.key }
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          STATE.nilaiRemote = await r.json();
          STATE.nilaiStatus = 'ok';
        } catch (err) {
          STATE.nilaiStatus = 'error';
        }
        renderApp();
      }

      function renderNilaiSection() {
        let isi = '';
        if (STATE.nilaiStatus === 'loading') isi = '<p class="text-xs text-slate-400">Memuat nilai...</p>';
        else if (STATE.nilaiStatus === 'error') isi = '<p class="text-xs text-rose-600">Gagal memuat nilai dari server. Coba Muat Ulang.</p>';
        else if (STATE.nilaiRemote.length === 0) isi = '<p class="text-xs text-slate-400">Belum ada nilai masuk.</p>';
        else isi = STATE.nilaiRemote.map(r => `
          <div class="flex flex-wrap items-start justify-between gap-2 text-xs border-t border-slate-100 pt-2">
            <div class="min-w-0">
              <p class="font-bold text-slate-800">${escapeHtml(r.nama)}</p>
              <p class="text-[11px] text-slate-500">${escapeHtml(r.judul || '-')} • ${escapeHtml(r.mapel || '-')}</p>
              <p class="text-[11px] text-slate-400">${new Date(r.updated_at).toLocaleString('id-ID')}</p>
              ${r.teks ? `<p class="text-[11px] text-slate-500 italic mt-0.5">"${escapeHtml(r.teks)}"</p>` : ''}
            </div>
            <span class="font-extrabold text-indigo-700">${r.skor}%</span>
          </div>`).join('');
        return `
          <section class="lg:col-span-12 bg-white rounded-2xl p-4 border border-slate-100 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="font-extrabold text-sm text-slate-800">Nilai Siswa (semua perangkat)</h2>
              <button onclick="window.MicroApp.refreshNilai()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">Muat Ulang</button>
            </div>
            ${isi}
          </section>`;
      }

      function renderAdminQuizBlocks(editing) {
        const list = editing?.quiz || [];
        let html = '<div class="p-3.5 rounded-2xl bg-purple-50/50 border border-purple-100 space-y-3"><p class="text-xs font-extrabold text-purple-800">2. Kuis Pemahaman (10 soal, berurutan 1-10)</p>';
        for (let i = 0; i < 10; i++) {
          const q = list[i] || { pertanyaan: '', opsi: [], jawaban: 0, pembahasan: '' };
          const opsi = q.opsi || [];
          html += `
            <div class="space-y-2 ${i > 0 ? 'pt-3 border-t border-purple-100' : ''}">
              <p class="text-[11px] font-extrabold text-purple-700">Soal ${i + 1}</p>
              <input id="admQ${i}Tanya" type="text" value="${escapeHtml(q.pertanyaan || '')}" placeholder="Pertanyaan soal ${i + 1}" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs bg-white" required />
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input id="admQ${i}OpsiA" type="text" value="${escapeHtml(opsi[0] || '')}" placeholder="Opsi A" class="rounded-xl border border-slate-200 p-2 text-xs bg-white" required />
                <input id="admQ${i}OpsiB" type="text" value="${escapeHtml(opsi[1] || '')}" placeholder="Opsi B" class="rounded-xl border border-slate-200 p-2 text-xs bg-white" required />
                <input id="admQ${i}OpsiC" type="text" value="${escapeHtml(opsi[2] || '')}" placeholder="Opsi C" class="rounded-xl border border-slate-200 p-2 text-xs bg-white" required />
                <input id="admQ${i}OpsiD" type="text" value="${escapeHtml(opsi[3] || '')}" placeholder="Opsi D" class="rounded-xl border border-slate-200 p-2 text-xs bg-white" required />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <select id="admQ${i}Jawaban" class="rounded-xl border border-slate-200 p-2 text-xs bg-white">
                  <option value="0" ${q.jawaban === 0 ? 'selected' : ''}>Jawaban Benar: A</option>
                  <option value="1" ${q.jawaban === 1 ? 'selected' : ''}>Jawaban Benar: B</option>
                  <option value="2" ${q.jawaban === 2 ? 'selected' : ''}>Jawaban Benar: C</option>
                  <option value="3" ${q.jawaban === 3 ? 'selected' : ''}>Jawaban Benar: D</option>
                </select>
                <input id="admQ${i}Pembahasan" type="text" value="${escapeHtml(q.pembahasan || '')}" placeholder="Penjelasan jawaban benar" class="sm:col-span-2 rounded-xl border border-slate-200 p-2 text-xs bg-white" required />
              </div>
            </div>`;
        }
        return html + '</div>';
      }

      function renderAdminView() {
        const editing = STATE.editingModuleId
          ? STATE.modules.find(m => m.id === STATE.editingModuleId)
          : null;

        return `
          <div class="min-h-screen bg-[#f4f6fb] pb-16">
            <header class="header-grad text-white py-5 px-4 sm:px-6 shadow-md">
              <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <button onclick="window.MicroApp.backToCatalog()" class="p-2 rounded-xl bg-white/15 hover:bg-white/25">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <div>
                    <h1 class="text-lg sm:text-xl font-extrabold">Panel Admin — Kelola Materi Microlearning</h1>
                    <p class="text-xs text-indigo-100">Tambah, edit, atau hapus video pengantar, kuis, dan refleksi</p>
                  </div>
                </div>
                <div class="flex flex-wrap gap-2">
                  <button onclick="window.MicroApp.resetStudentProgress()" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold">
                    Reset Progres Siswa
                  </button>
                  <button onclick="window.MicroApp.restoreDefaultModules()" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold">
                    Pulihkan Materi Bawaan
                  </button>
                </div>
              </div>
            </header>

            <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- NILAI SISWA dari Supabase (semua perangkat) -->
              ${renderNilaiSection()}

              <!-- KOLOM KIRI: DAFTAR MODUL YANG ADA -->
              <div class="lg:col-span-5 space-y-3">
                <div class="flex items-center justify-between">
                  <h2 class="font-extrabold text-sm text-slate-800">Daftar Materi (${STATE.modules.length})</h2>
                  <button onclick="window.MicroApp.newModuleForm()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                    + Modul Baru
                  </button>
                </div>

                <div class="space-y-2.5">
                  ${STATE.modules.map(m => `
                    <div class="bg-white rounded-2xl p-4 border ${STATE.editingModuleId === m.id ? 'border-indigo-600 ring-2 ring-indigo-100' : 'border-slate-100'} flex items-start justify-between gap-2">
                      <div class="min-w-0">
                        <span class="text-[10px] font-extrabold uppercase text-indigo-600">${escapeHtml(m.mapel)} • Kelas ${escapeHtml(m.kelas)}</span>
                        <h3 class="font-bold text-xs sm:text-sm text-slate-800 truncate mt-0.5">${escapeHtml(m.judul)}</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">Durasi: ${escapeHtml(m.durasi)}</p>
                      </div>
                      <div class="flex gap-1.5 shrink-0">
                        <button onclick="window.MicroApp.editModuleForm('${m.id}')" class="p-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700" title="Edit Materi">
                          <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="window.MicroApp.deleteModule('${m.id}')" class="p-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600" title="Hapus Materi">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- KOLOM KANAN: FORM TAMBAH / EDIT MATERI LENGKAP -->
              <div class="lg:col-span-7">
                <form onsubmit="window.MicroApp.saveModuleForm(event)" class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-xs space-y-4">
                  <h2 class="font-extrabold text-base text-slate-800 border-b border-slate-100 pb-3">
                    ${editing ? `Edit Materi: ${escapeHtml(editing.judul)}` : 'Tambah Materi Microlearning Baru'}
                  </h2>

                  <!-- Informasi Dasar -->
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran *</label>
                      <input id="admMapel" type="text" value="${escapeHtml(editing?.mapel || 'Matematika')}" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs" required />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Kelas *</label>
                      <input id="admKelas" type="text" value="${escapeHtml(editing?.kelas || 'VIII')}" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs" required />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Estimasi Durasi *</label>
                      <input id="admDurasi" type="text" value="${escapeHtml(editing?.durasi || '4 Menit')}" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs" required />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Judul Topik Microlearning *</label>
                    <input id="admJudul" type="text" value="${escapeHtml(editing?.judul || '')}" placeholder="Contoh: Teorema Pythagoras Segitiga Siku-Siku" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs" required />
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Ringkasan Singkat *</label>
                    <textarea id="admRingkasan" rows="2" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs" required>${escapeHtml(editing?.ringkasan || '')}</textarea>
                  </div>

                  <!-- 1. VIDEO PENGANTAR -->
                  <div class="p-3.5 rounded-2xl bg-rose-50/50 border border-rose-100 space-y-2.5">
                    <p class="text-xs font-extrabold text-rose-800">1. Video Pengantar</p>
                    <input id="admVidJudul" type="text" value="${escapeHtml(editing?.video?.judul || '')}" placeholder="Judul Video Pengantar" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs bg-white" required />
                    <input id="admVidUrl" type="url" value="${escapeHtml(editing?.video?.url || '')}" placeholder="Link YouTube (cth: https://www.youtube.com/watch?v=...)" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs bg-white" required />
                    <input id="admVidCatatan" type="text" value="${escapeHtml(editing?.video?.catatanVideo || '')}" placeholder="Instruksi menyimak video untuk siswa" class="w-full rounded-xl border border-slate-200 p-2.5 text-xs bg-white" />
                  </div>

                  <!-- 4. KUIS 10 SOAL -->
                  ${renderAdminQuizBlocks(editing)}

                  <!-- 5. REFLEKSI PEMBELAJARAN -->
                  <div class="p-3.5 rounded-2xl bg-emerald-50/50 border border-emerald-100 space-y-2">
                    <p class="text-xs font-extrabold text-emerald-800">3. Pertanyaan Refleksi Pembelajaran</p>
                    <input id="admRefleksi" type="text" value="${escapeHtml(editing?.refleksiPertanyaan || '')}" placeholder="Pertanyaan refleksi untuk dijawab siswa di akhir modul..." class="w-full rounded-xl border border-slate-200 p-2.5 text-xs bg-white" required />
                  </div>

                  <button type="submit" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs sm:text-sm shadow-md">
                    ${editing ? 'Simpan Perubahan Materi' : 'Publikasikan Materi Baru'}
                  </button>
                </form>
              </div>
            </main>
          </div>
        `;
      }

      // Modal PIN Admin agar siswa tidak mengedit materi secara tidak sengaja
      function openAdminPinModal() {
        if (STATE.isAdminUnlocked) {
          STATE.view = 'admin';
          renderApp();
          return;
        }
        document.getElementById('modalRoot').innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-fade-up">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-extrabold text-base text-slate-800">Akses Admin Edit Materi</h3>
                <button onclick="window.MicroApp.closeModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
              </div>
              <p class="text-xs text-slate-500 mb-4">Masukkan PIN Admin / Guru untuk mengelola modul microlearning.</p>
              <form onsubmit="window.MicroApp.verifyAdminPin(event)" class="space-y-3">
                <input id="adminPinInput" type="password" inputmode="numeric" placeholder="Masukkan PIN Admin" class="w-full rounded-xl border border-slate-200 p-3 text-center text-base font-extrabold tracking-widest" required autofocus />
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-xs">Buka Panel Admin</button>
              </form>
            </div>
          </div>
        `;
      }

      function renderApp() {
        const root = document.getElementById('appRoot');
        if (!root) return;
        if (STATE.view === 'player') {
          root.innerHTML = renderPlayerView();
        } else if (STATE.view === 'admin') {
          if (STATE.nilaiStatus === 'idle') loadNilaiRemote();
          root.innerHTML = renderAdminView();
        } else {
          root.innerHTML = renderCatalogView();
        }
        if (window.lucide) lucide.createIcons();
      }

      // =========================================================================
      // 8. AKSI GLOBAL
      // =========================================================================
      window.MicroApp = {
        setMapel(mp) { STATE.selectedMapel = mp; renderApp(); },
        setSearch(q) { STATE.searchQuery = q; renderApp(); },
        closeModal() { document.getElementById('modalRoot').innerHTML = ''; },

        startModule(id) {
          STATE.activeModuleId = id;
          STATE.view = 'player';
          STATE.learnStep = 'video';
          STATE.quizIndex = 0;
          STATE.selectedOption = null;
          STATE.showQuizFeedback = false;
          STATE.quizCorrect = 0;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        backToCatalog() {
          STATE.view = 'catalog';
          STATE.activeModuleId = null;
          renderApp();
        },

        jumpStep(stepId) {
          STATE.learnStep = stepId;
          if (stepId === 'quiz') {
            STATE.quizIndex = 0;
            STATE.selectedOption = null;
            STATE.showQuizFeedback = false;
            STATE.quizCorrect = 0;
          }
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        startQuizStep() {
          this.jumpStep('quiz');
        },

        pickOption(idx) {
          STATE.selectedOption = idx;
          renderApp();
        },

        submitQuizItem() {
          const mod = STATE.modules.find(m => m.id === STATE.activeModuleId);
          if (!mod || STATE.selectedOption === null) return;
          if (STATE.selectedOption === mod.quiz[STATE.quizIndex].jawaban) {
            STATE.quizCorrect++;
          }
          STATE.showQuizFeedback = true;
          renderApp();
        },

        nextQuizItem() {
          const mod = STATE.modules.find(m => m.id === STATE.activeModuleId);
          if (!mod) return;
          if (STATE.quizIndex < mod.quiz.length - 1) {
            STATE.quizIndex++;
            STATE.selectedOption = null;
            STATE.showQuizFeedback = false;
            renderApp();
          } else {
            STATE.learnStep = 'refleksi';
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        },

        finishModuleWithReflection(e) {
          e.preventDefault();
          const mod = STATE.modules.find(m => m.id === STATE.activeModuleId);
          if (!mod) return;

          const nama = document.getElementById('refNamaSiswa')?.value.trim() || '';
          const teks = document.getElementById('refJawabanSiswa')?.value.trim() || '';
          if (!nama) {
            alert('Nama siswa wajib diisi.');
            return;
          }

          const totalQ = (mod.quiz || []).length;
          const score = totalQ > 0 ? Math.round((STATE.quizCorrect / totalQ) * 100) : 100;

          if (!STATE.progress.completedIds.includes(mod.id)) {
            STATE.progress.completedIds.push(mod.id);
          }
          STATE.progress.scores[mod.id] = Math.max(score, STATE.progress.scores[mod.id] || 0);
          STATE.progress.reflections[mod.id] = { nama, teks, updatedAt: new Date().toISOString() };
          saveProgress();
          sendNilaiRemote(mod, nama, score, teks);

          STATE.learnStep = 'selesai';
          showToast('Modul Selesai!', 'Refleksi dan skor belajar berhasil disimpan.');
          renderApp();
        },

        resetStudentProgress() {
          STATE.progress = { completedIds: [], scores: {}, reflections: {} };
          saveProgress();
          showToast('Progres Direset', 'Status belajar dikembalikan ke awal.', 'info');
          renderApp();
        },

        // Admin Actions
        openAdminGate: openAdminPinModal,

        verifyAdminPin(e) {
          e.preventDefault();
          const pin = document.getElementById('adminPinInput')?.value.trim();
          if (pin === ADMIN_PIN) {
            STATE.isAdminUnlocked = true;
            this.closeModal();
            STATE.view = 'admin';
            renderApp();
          } else {
            showToast('PIN Salah', 'Periksa kembali PIN Admin.', 'error');
          }
        },

        refreshNilai() {
          STATE.nilaiStatus = 'idle';
          renderApp();
        },

        newModuleForm() {
          STATE.editingModuleId = null;
          renderApp();
        },

        editModuleForm(id) {
          STATE.editingModuleId = id;
          renderApp();
        },

        deleteModule(id) {
          STATE.modules = STATE.modules.filter(m => m.id !== id);
          if (STATE.editingModuleId === id) STATE.editingModuleId = null;
          saveModules(STATE.modules);
          showToast('Materi Dihapus', '', 'info');
          renderApp();
        },

        saveModuleForm(e) {
          e.preventDefault();
          const themes = ['pastel-peach', 'pastel-mint', 'pastel-purple', 'pastel-blue', 'pastel-yellow'];
          const icons = ['calculator', 'microscope', 'book-open', 'cpu', 'globe'];
          const idxColor = STATE.modules.length % themes.length;

          const payload = {
            id: STATE.editingModuleId || ('ml-' + Date.now()),
            mapel: document.getElementById('admMapel').value.trim(),
            kelas: document.getElementById('admKelas').value.trim(),
            durasi: document.getElementById('admDurasi').value.trim(),
            tema: STATE.editingModuleId
              ? (STATE.modules.find(m => m.id === STATE.editingModuleId)?.tema || themes[idxColor])
              : themes[idxColor],
            iconBg: 'bg-indigo-600',
            icon: icons[idxColor],
            judul: document.getElementById('admJudul').value.trim(),
            ringkasan: document.getElementById('admRingkasan').value.trim(),
            video: {
              judul: document.getElementById('admVidJudul').value.trim(),
              url: document.getElementById('admVidUrl').value.trim(),
              durasiVideo: '02:30',
              catatanVideo: document.getElementById('admVidCatatan').value.trim()
            },
            quiz: Array.from({ length: 10 }, (_, i) => ({
              pertanyaan: document.getElementById(`admQ${i}Tanya`).value.trim(),
              opsi: ['A', 'B', 'C', 'D'].map(k => document.getElementById(`admQ${i}Opsi${k}`).value.trim()),
              jawaban: Number(document.getElementById(`admQ${i}Jawaban`).value),
              pembahasan: document.getElementById(`admQ${i}Pembahasan`).value.trim()
            })),
            refleksiPertanyaan: document.getElementById('admRefleksi').value.trim()
          };

          if (STATE.editingModuleId) {
            const idx = STATE.modules.findIndex(m => m.id === STATE.editingModuleId);
            if (idx !== -1) STATE.modules[idx] = payload;
            showToast('Materi Diperbarui', 'Perubahan langsung tampil untuk siswa.');
          } else {
            STATE.modules.unshift(payload);
            showToast('Materi Ditambahkan', 'Modul baru berhasil dipublikasikan.');
          }

          saveModules(STATE.modules);
          STATE.editingModuleId = null;
          renderApp();
        },

        restoreDefaultModules() {
          STATE.modules = [...DEFAULT_MODULES];
          STATE.editingModuleId = null;
          saveModules(STATE.modules);
          showToast('Materi Dipulihkan', 'Kembali ke daftar materi awal.', 'info');
          renderApp();
        }
      };

      renderApp();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW gagal:', err));
      });
    }
  </script>
</body>
</html>
