  <!-- FIREBASE SDK MODULE (Dengan dukungan Firestore & Auth + Sinkronisasi Otomatis) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseBridge = {
      enabled: false,
      db: null,
      auth: null,
      appId: typeof __app_id !== 'undefined' ? __app_id : 'smp-pgri-sumberagung-portal',
      statusText: 'Mode Cloud & Sinkronisasi Real-Time Siap',
      async init(customConfig = null) {
        try {
          let config = customConfig;
          if (!config && typeof __firebase_config !== 'undefined' && __firebase_config) {
            config = JSON.parse(__firebase_config);
          }
          if (!config || !config.apiKey) {
            this.enabled = false;
            this.statusText = 'Database Lokal Aktif (Siap dihubungkan ke Firebase)';
            return false;
          }
          const app = initializeApp(config);
          this.auth = getAuth(app);
          this.db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(this.auth, __initial_auth_token);
          } else {
            await signInAnonymously(this.auth);
          }

          if (!this.auth.currentUser) return false;
          this.enabled = true;
          this.statusText = 'Terhubung ke Firebase Cloud Firestore';

          // Dengarkan perubahan state bersama di path publik
          const stateDocRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'portal_state', 'main');
          const snap = await getDoc(stateDocRef);
          if (snap.exists() && snap.data().payload) {
            const cloudData = JSON.parse(snap.data().payload);
            if (window.PortalApp && window.PortalApp.mergeCloudState) {
              window.PortalApp.mergeCloudState(cloudData);
            }
          } else if (window.PortalApp) {
            await this.pushState(window.PortalApp.getSerializableState());
          }

          onSnapshot(stateDocRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().payload && window.PortalApp) {
              const incoming = JSON.parse(docSnap.data().payload);
              window.PortalApp.mergeCloudState(incoming, true);
            }
          }, (err) => {
            console.warn('Firestore snapshot listener info:', err.message);
          });

          return true;
        } catch (e) {
          console.warn('Firebase fallback aktif:', e.message);
          this.enabled = false;
          this.statusText = 'Sinkronisasi Lokal Aktif (Offline-Ready)';
          return false;
        }
      },
      async pushState(stateObj) {
        if (!this.enabled || !this.db || !this.auth?.currentUser) return;
        try {
          const stateDocRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'portal_state', 'main');
          await setDoc(stateDocRef, {
            payload: JSON.stringify(stateObj),
            updatedAt: new Date().toISOString()
          });
        } catch (err) {
          console.warn('Gagal menyinkronkan ke cloud:', err.message);
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.FirebaseBridge.init();
    });
  </script>

      function showToast(title, message = '', type = 'info') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const colors = {
          success: 'bg-emerald-600 text-white border-emerald-400',
          error: 'bg-rose-600 text-white border-rose-400',
          warning: 'bg-amber-500 text-white border-amber-300',
          info: 'bg-indigo-600 text-white border-indigo-400'
        };

        const icons = {
          success: 'check-circle-2',
          error: 'alert-circle',
          warning: 'alert-triangle',
          info: 'bell-ring'
        };

        const el = document.createElement('div');
        el.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl shadow-xl border ${colors[type] || colors.info} animate-fade-up`;
        el.innerHTML = `
          <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5"></i>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-sm leading-tight">${escapeHtml(title)}</p>
            ${message ? `<p class="text-xs opacity-90 mt-1 leading-snug">${escapeHtml(message)}</p>` : ''}
          </div>
          <button onclick="this.parentElement.remove()" class="opacity-75 hover:opacity-100 p-0.5">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        `;
        container.appendChild(el);
        if (window.lucide) lucide.createIcons();

        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-8px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 4200);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatTanggalIndo(dateStr) {
        if (!dateStr) return '-';
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          return d.toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
          });
        } catch {
          return dateStr;
        }
      }

      function formatDateTimeIndo(dateStr) {
        if (!dateStr) return '-';
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          return d.toLocaleString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }) + ' WIB';
        } catch {
          return dateStr;
        }
      }

      function formatFileSize(bytes) {
        if (!bytes) return '124 KB';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      // Mengunduh file (baik dari DataURL unggahan asli maupun dokumen teks/PDF simulasi)
      function triggerFileDownload(fileName, dataUrl, fallbackContent) {
        try {
          const link = document.createElement('a');
          if (dataUrl && dataUrl.startsWith('data:')) {
            link.href = dataUrl;
          } else {
            const content = fallbackContent || `DOKUMEN RESMI - STUDENT PORTAL SMP PGRI SUMBERAGUNG\nNama File: ${fileName}\nDiunduh pada: ${new Date().toLocaleString('id-ID')}\nCreated by Danang Wahyudi`;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            link.href = URL.createObjectURL(blob);
          }
          link.download = fileName || 'dokumen-smp-pgri-sumberagung.txt';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('Mengunduh File', `File "${fileName}" berhasil diunduh.`, 'success');

      function saveAndSync(logActionText = null) {
        if (logActionText && APP_STATE.currentUser) {
          APP_STATE.db.logs.unshift({
            id: 'log-' + Date.now(),
            waktu: new Date().toLocaleString('id-ID', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
            user: `${APP_STATE.currentUser.nama} (${APP_STATE.currentUser.role.toUpperCase()})`,
            aksi: logActionText
          });
        }
        if (window.FirebaseBridge && window.FirebaseBridge.enabled) {
          window.FirebaseBridge.pushState(APP_STATE.db);
        }
      }

      function addNotification(title, desc, targetTab = 'home') {
        APP_STATE.db.notifications.unshift({
          id: 'notif-' + Date.now() + Math.random().toString(36).slice(2, 6),
          title,
          desc,
          time: 'Baru saja',
          read: false,
          targetTab
        });
      }

      window.PortalApp = {
        getSerializableState() {
          return APP_STATE.db;
        },
        mergeCloudState(cloudDb, reRender = false) {
          if (cloudDb && cloudDb.users && cloudDb.tugas) {
            APP_STATE.db = cloudDb;
            if (APP_STATE.currentUser) {
              const updatedUser = APP_STATE.db.users.find(u => u.id === APP_STATE.currentUser.id);
              if (updatedUser) APP_STATE.currentUser = updatedUser;
            }
            if (reRender) renderApp();
          }
        }
      };

      // =========================================================================
      function handleLoginSubmit(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('loginUsername').value.trim().toLowerCase();
        const passwordInput = document.getElementById('loginPassword').value.trim();

        if (!usernameInput || !passwordInput) {
          showToast('Data Belum Lengkap', 'Silakan isi Username dan Password terlebih dahulu.', 'warning');
          return;
        }

        const foundUser = APP_STATE.db.users.find(u =>
          (u.username.toLowerCase() === usernameInput || (u.email && u.email.toLowerCase() === usernameInput) || (u.nisn && u.nisn === usernameInput)) &&
          u.password === passwordInput &&
          u.role === APP_STATE.selectedLoginRole
        );

        // Juga izinkan login jika username & password cocok meskipun tab peran berbeda
        const fallbackUser = foundUser || APP_STATE.db.users.find(u =>
          (u.username.toLowerCase() === usernameInput || (u.email && u.email.toLowerCase() === usernameInput)) &&
          u.password === passwordInput
        );

        if (!fallbackUser) {
          showToast('Login Gagal', 'Username, Password, atau Peran tidak sesuai. Gunakan akun demo atau daftar akun baru.', 'error');
          return;
        }

        APP_STATE.currentUser = fallbackUser;
        APP_STATE.activeView = 'home';
        APP_STATE.searchQuery = '';
        saveAndSync('Berhasil login ke Student Portal.');
        showToast(`Selamat Datang, ${fallbackUser.nama}!`, `Anda masuk sebagai ${fallbackUser.role.toUpperCase()}.`, 'success');
        renderApp();
      }

      function quickDemoLogin(role) {
        const user = APP_STATE.db.users.find(u => u.role === role);
        if (!user) return;
        APP_STATE.currentUser = user;
        APP_STATE.activeView = 'home';
        APP_STATE.searchQuery = '';
        saveAndSync(`Login cepat (Demo) sebagai ${role}.`);
        showToast(`Berhasil Masuk (${role.toUpperCase()})`, `Halo, ${user.nama}!`, 'success');
        renderApp();
      }

      function handleRegisterSiswa(e) {
        e.preventDefault();
        const nama = document.getElementById('regNama').value.trim();
        const nisn = document.getElementById('regNisn').value.trim();
        const kelas = document.getElementById('regKelas').value;
        const username = document.getElementById('regUsername').value.trim().toLowerCase();
        const password = document.getElementById('regPassword').value.trim();

        if (!nama || !nisn || !username || !password) {
          showToast('Form Belum Lengkap', 'Harap lengkapi semua kolom pendaftaran siswa.', 'warning');
          return;
        }

        if (APP_STATE.db.users.some(u => u.username.toLowerCase() === username)) {
          showToast('Username Sudah Digunakan', 'Silakan pilih username lain.', 'error');
          return;

      function getStudentTaskStatus(tugas, siswaId) {
        const sub = APP_STATE.db.pengumpulan.find(s => s.tugasId === tugas.id && s.siswaId === siswaId);
        const now = new Date();
        const deadline = new Date(tugas.deadline);

        if (sub) {
          if (sub.nilai !== null && sub.nilai !== undefined && sub.nilai !== '') {
            return { code: 'dinilai', label: 'Sudah Dinilai', badgeClass: 'bg-emerald-100 text-emerald-700 border-emerald-200', submission: sub };
          }
          return { code: 'dikumpulkan', label: 'Sudah Dikumpulkan', badgeClass: 'bg-blue-100 text-blue-700 border-blue-200', submission: sub };
        }
        if (now > deadline) {
          return { code: 'terlambat', label: 'Terlambat', badgeClass: 'bg-rose-100 text-rose-700 border-rose-200', submission: null };
        }
        return { code: 'belum', label: 'Belum Dikerjakan', badgeClass: 'bg-amber-100 text-amber-700 border-amber-200', submission: null };
      }

      // =========================================================================
      // 9. FITUR MANAJEMEN TUGAS (SISWA) & KELOLA/NILAI TUGAS (GURU)
      // =========================================================================
      function renderTugasPage() {
        const user = APP_STATE.currentUser;
        if (user.role === 'guru' || user.role === 'admin') {
          return renderGuruTugasManager();
        }

        // TAMPILAN TUGAS UNTUK SISWA (Instruksi #4)
        const allClassTasks = APP_STATE.db.tugas.filter(t => !user.kelas || t.kelas === user.kelas);
        const enriched = allClassTasks.map(t => ({
          ...t,
          statusObj: getStudentTaskStatus(t, user.id)
        }));

        const categories = [
          { id: 'semua', label: 'Semua Tugas', count: enriched.length },
          { id: 'belum', label: 'Belum Dikerjakan', count: enriched.filter(x => x.statusObj.code === 'belum').length },
          { id: 'dikumpulkan', label: 'Sudah Dikumpulkan', count: enriched.filter(x => x.statusObj.code === 'dikumpulkan').length },
          { id: 'terlambat', label: 'Terlambat', count: enriched.filter(x => x.statusObj.code === 'terlambat').length },
          { id: 'dinilai', label: 'Sudah Dinilai', count: enriched.filter(x => x.statusObj.code === 'dinilai').length }
        ];

        const filteredTasks = enriched.filter(t => {
          const matchCat = APP_STATE.taskCategory === 'semua' || t.statusObj.code === APP_STATE.taskCategory;
          const q = APP_STATE.searchQuery.toLowerCase();
          const matchSearch = !q || t.judul.toLowerCase().includes(q) || t.mapel.toLowerCase().includes(q) || t.guruNama.toLowerCase().includes(q);
          return matchCat && matchSearch;
        });

        return `
          <div class="space-y-4 animate-fade-up">
            <!-- Header & Tombol Kembali -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <button onclick="window.AppActions.navigate('home')" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <div>
                  <h2 class="text-lg font-extrabold text-slate-800">Tugas Sekolah (${escapeHtml(user.kelas)})</h2>
                  <p class="text-xs text-slate-500">Kerjakan dan unggah file tugas sebelum deadline</p>
                </div>
              </div>
            </div>

            <!-- Tab Kategori Tugas (Semua, Belum Dikerjakan, Sudah Dikumpulkan, Terlambat, Sudah Dinilai) -->
            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
              ${categories.map(c => `
                <button onclick="window.AppActions.setTaskCategory('${c.id}')"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 border ${APP_STATE.taskCategory === c.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
                  <span>${c.label}</span>
                  <span class="px-1.5 py-0.5 rounded-full text-[10px] ${APP_STATE.taskCategory === c.id ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'}">
                    ${c.count}
                  </span>
                </button>
              `).join('')}
            </div>

            <!-- Daftar Kartu Tugas -->
            ${filteredTasks.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center border border-slate-100">
                <i data-lucide="folder-open" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                <p class="font-bold text-sm text-slate-700">Tidak ada tugas pada kategori ini</p>
                <p class="text-xs text-slate-500 mt-1">Pilih tab kategori lain di atas untuk melihat daftar tugas.</p>
              </div>
            ` : `
              <div class="space-y-3.5">
                ${filteredTasks.map(t => {
                  const st = t.statusObj;
                  const sub = st.submission;
                  return `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-slate-100 space-y-3">
                      <!-- Baris Atas: Mapel & Status -->
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="px-3 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold">
                          ${escapeHtml(t.mapel)}
                        </span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold border ${st.badgeClass}">
                          ${st.label}
                        </span>
                      </div>

                      <!-- Judul & Nama Guru -->
                      <div>
                        <h3 class="font-extrabold text-base text-slate-800 leading-snug">${escapeHtml(t.judul)}</h3>
                        <p class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">
                          <i data-lucide="user-check" class="w-3.5 h-3.5 text-indigo-500"></i>
                          <span>Guru: <b class="text-slate-700">${escapeHtml(t.guruNama)}</b></span>
                        </p>
                      </div>

                      <!-- Deskripsi & Petunjuk Pengerjaan -->
                      <div class="bg-slate-50 rounded-xl p-3 text-xs text-slate-700 space-y-1.5 border border-slate-100">
                        <p><b>Deskripsi:</b> ${escapeHtml(t.deskripsi)}</p>
                        <p class="text-slate-600"><b>Petunjuk:</b> ${escapeHtml(t.petunjuk)}</p>
                      </div>

                      <!-- Tanggal Pemberian, Deadline, & Lampiran Guru -->
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div class="flex items-center gap-2 text-slate-600 bg-slate-50 px-3 py-2 rounded-xl">
                          <i data-lucide="calendar" class="w-4 h-4 text-blue-500 shrink-0"></i>
                          <span>Diberikan: <b>${formatTanggalIndo(t.tanggalPemberian)}</b></span>
                        </div>
                        <div class="flex items-center gap-2 text-slate-600 bg-rose-50/60 px-3 py-2 rounded-xl">
                          <i data-lucide="alarm-clock" class="w-4 h-4 text-rose-500 shrink-0"></i>
                          <span>Deadline: <b class="text-rose-700">${formatDateTimeIndo(t.deadline)}</b></span>
                        </div>
                      </div>

                      ${t.lampiranNama ? `
                        <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-blue-50/70 border border-blue-100">
                          <div class="flex items-center gap-2 min-w-0">
                            <i data-lucide="paperclip" class="w-4 h-4 text-blue-600 shrink-0"></i>
                            <span class="text-xs font-semibold text-blue-900 truncate">${escapeHtml(t.lampiranNama)}</span>
                          </div>
                          <button onclick="window.AppActions.downloadTeacherAttachment('${t.id}')"
                            class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shrink-0 flex items-center gap-1">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh Soal
                          </button>
                        </div>
                      ` : ''}

                      <!-- Bagian Hasil Pengumpulan / Nilai Guru / Tombol Unggah Jawaban -->
                      ${sub ? `
                        <div class="p-3.5 rounded-xl bg-emerald-50/70 border border-emerald-200 space-y-2.5">
                          <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                              <p class="text-xs font-bold text-emerald-900">File Jawaban Terkumpul:</p>
                              <p class="text-xs text-emerald-700 font-medium break-all">${escapeHtml(sub.fileName)} (${escapeHtml(sub.fileSize)})</p>
                              <p class="text-[11px] text-slate-500 mt-0.5">Dikumpulkan: ${formatDateTimeIndo(sub.submittedAt)}</p>
                            </div>
                            <button onclick="window.AppActions.downloadStudentSubmission('${sub.id}')"
                              class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shrink-0">
                              <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh Kembali
                            </button>
                          </div>

                          ${sub.nilai !== null && sub.nilai !== undefined && sub.nilai !== '' ? `
                            <div class="pt-2.5 border-t border-emerald-200 flex items-start gap-3">
                              <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex flex-col items-center justify-center shrink-0">
                                <span class="text-[9px] uppercase font-bold">Nilai</span>
                                <span class="text-lg font-extrabold leading-none">${sub.nilai}</span>
                              </div>
                              <div class="text-xs">
                                <p class="font-bold text-slate-800">Komentar & Catatan Guru:</p>
                                <p class="text-slate-600 mt-0.5 italic">"${escapeHtml(sub.komentarGuru || 'Bagus, pertahankan prestasi belajarmu!')}"</p>
                              </div>
                            </div>
                          ` : `
                            <div class="pt-2 border-t border-emerald-200 flex items-center justify-between">
                              <span class="text-[11px] text-emerald-800 font-medium">Menunggu penilaian dari guru...</span>
                              <button onclick="window.AppActions.openUploadTaskModal('${t.id}')" class="text-xs font-bold text-indigo-600 hover:underline">
                                Ganti File Jawaban
                              </button>
                            </div>
                          `}
                        </div>
                      ` : `
                        <button onclick="window.AppActions.openUploadTaskModal('${t.id}')"
                          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm transition">
                          <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                          <span>Unggah Jawaban Tugas (PDF, DOC, DOCX, PPT, PPTX, JPG)</span>
                        </button>
                      `}
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }

      // Modal Upload Jawaban Tugas Siswa (Mendukung file asli dari HP/Komputer)
      function openUploadTaskModal(tugasId) {
        const tugas = APP_STATE.db.tugas.find(t => t.id === tugasId);
        if (!tugas) return;

        const modal = document.getElementById('modalRoot');

      window.AppActions = {
        setLoginRole(role) {
          APP_STATE.selectedLoginRole = role;
          renderApp();
        },
        togglePassword() {
          APP_STATE.showPassword = !APP_STATE.showPassword;
          renderApp();
        },
        toggleRemember(val) {
          APP_STATE.rememberMe = val;
        },
        switchLoginMode(mode) {
          APP_STATE.loginMode = mode;
          renderApp();
        },
        submitLogin: handleLoginSubmit,
        demoLogin: quickDemoLogin,
        submitRegister: handleRegisterSiswa,
        logout: logoutUser,

        navigate(viewId) {
          APP_STATE.activeView = viewId;
          if (viewId !== 'guru_tambah_tugas') APP_STATE.editingTaskId = null;
          APP_STATE.showSidebar = false;
          APP_STATE.showNotifDropdown = false;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        toggleSidebar() {
          APP_STATE.showSidebar = !APP_STATE.showSidebar;
          renderApp();
        },
        toggleNotif() {
          APP_STATE.showNotifDropdown = !APP_STATE.showNotifDropdown;
          renderApp();
        },
        markAllNotifRead() {
          APP_STATE.db.notifications.forEach(n => n.read = true);
          saveAndSync();
          renderApp();
        },
        openNotifItem(notifId, targetTab) {
          const n = APP_STATE.db.notifications.find(x => x.id === notifId);
          if (n) n.read = true;
          APP_STATE.showNotifDropdown = false;
          APP_STATE.activeView = targetTab || 'home';
          renderApp();
        },
        handleSearch(val) {
          APP_STATE.searchQuery = val;
          renderApp();
        },
        setTaskCategory(cat) {
          APP_STATE.taskCategory = cat;
          renderApp();
        },
        setJadwalHari(hari) {
          APP_STATE.selectedJadwalHari = hari;
          renderApp();
        },
        closeModal() {
          const modal = document.getElementById('modalRoot');
          if (modal) modal.innerHTML = '';
        },

        // Upload & Download File Tugas Siswa
        openUploadTaskModal,
        previewSelectedFileName(input) {
          const file = input.files && input.files[0];
          const box = document.getElementById('selectedFilePreviewBox');
          const txt = document.getElementById('selectedFileNameText');
          if (file && box && txt) {
            box.classList.remove('hidden');
            txt.textContent = `${file.name} (${formatFileSize(file.size)})`;
          }
        },
        submitStudentTaskFile(e, tugasId) {
          e.preventDefault();
          const input = document.getElementById('studentTaskFileInput');
          const note = document.getElementById('studentTaskNote')?.value.trim() || '';
          const file = input?.files?.[0];
          if (!file) {
            showToast('Pilih File Terlebih Dahulu', 'Silakan pilih file PDF, DOC, DOCX, PPT, PPTX, atau JPG.', 'warning');
            return;
          }

          const reader = new FileReader();
          reader.onload = function (evt) {
            const dataUrl = evt.target.result;
            const user = APP_STATE.currentUser;
            const tugas = APP_STATE.db.tugas.find(t => t.id === tugasId);

            // Hapus pengumpulan lama jika mengganti file
            APP_STATE.db.pengumpulan = APP_STATE.db.pengumpulan.filter(s => !(s.tugasId === tugasId && s.siswaId === user.id));

            APP_STATE.db.pengumpulan.unshift({
              id: 'sub-' + Date.now(),
              tugasId,
              siswaId: user.id,
              siswaNama: user.nama,
              kelas: user.kelas || 'VIII-A',
              fileName: file.name,
              fileSize: formatFileSize(file.size),
              fileType: file.type,
              fileDataUrl: dataUrl,
              catatanSiswa: note,
              submittedAt: new Date().toISOString(),
              nilai: null,
              komentarGuru: ''
            });

            addNotification(
              'Tugas Berhasil Dikumpulkan',
              `${user.nama} mengumpulkan jawaban untuk "${tugas ? tugas.judul : 'Tugas Sekolah'}".`,
              'tugas'
            );
            saveAndSync(`Mengumpulkan tugas "${tugas ? tugas.judul : tugasId}" (${file.name}).`);
            window.AppActions.closeModal();
            showToast('Tugas Berhasil Dikirim!', `File "${file.name}" telah tersimpan.`, 'success');
            renderApp();
          };
          reader.readAsDataURL(file);
        },

        downloadTeacherAttachment(tugasId) {
          const t = APP_STATE.db.tugas.find(x => x.id === tugasId);
          if (!t) return;
          triggerFileDownload(
            t.lampiranNama || 'Lampiran_Tugas.txt',
            t.lampiranDataUrl,
            `LAMPIRAN TUGAS - SMP PGRI SUMBERAGUNG\nJudul: ${t.judul}\nMata Pelajaran: ${t.mapel}\nGuru: ${t.guruNama}\n\nDeskripsi:\n${t.deskripsi}\n\nPetunjuk:\n${t.petunjuk}`
          );
        },

        downloadStudentSubmission(subId) {
          const s = APP_STATE.db.pengumpulan.find(x => x.id === subId);
          if (!s) return;
          triggerFileDownload(
            s.fileName,
            s.fileDataUrl,
            `JAWABAN TUGAS SISWA - SMP PGRI SUMBERAGUNG\nNama Siswa: ${s.siswaNama} (${s.kelas})\nFile: ${s.fileName}\nWaktu Kirim: ${s.submittedAt}\nCatatan: ${s.catatanSiswa || '-'}`
          );
        },

        downloadGenericDoc(fileName, textContent) {
          triggerFileDownload(fileName, '', textContent);
        },

        // Manajemen Tugas & Penilaian oleh Guru
        saveTeacherTask(e, editId) {
          e.preventDefault();
          const judul = document.getElementById('gtJudul').value.trim();
          const mapel = document.getElementById('gtMapel').value;
          const kelas = document.getElementById('gtKelas').value;
          const deskripsi = document.getElementById('gtDeskripsi').value.trim();
          const petunjuk = document.getElementById('gtPetunjuk').value.trim();
          const tanggalPemberian = document.getElementById('gtTglBeri').value;
          const deadline = document.getElementById('gtDeadline').value;
          const fileInput = document.getElementById('gtFile');
          const file = fileInput?.files?.[0];

          const finalizeSave = (lampiranNama, lampiranSize, lampiranDataUrl) => {
            if (editId) {
              const idx = APP_STATE.db.tugas.findIndex(t => t.id === editId);
              if (idx !== -1) {
                APP_STATE.db.tugas[idx] = {
                  ...APP_STATE.db.tugas[idx],
                  judul, mapel, kelas, deskripsi, petunjuk, tanggalPemberian, deadline,
                  lampiranNama: lampiranNama || APP_STATE.db.tugas[idx].lampiranNama,
                  lampiranSize: lampiranSize || APP_STATE.db.tugas[idx].lampiranSize,
                  lampiranDataUrl: lampiranDataUrl || APP_STATE.db.tugas[idx].lampiranDataUrl
                };
              }
              saveAndSync(`Memperbarui tugas "${judul}".`);
              showToast('Tugas Diperbarui', 'Perubahan tugas berhasil disimpan.', 'success');
            } else {
              APP_STATE.db.tugas.unshift({
                id: 't-' + Date.now(),
                judul,
                mapel,
                kelas,
                guruId: APP_STATE.currentUser.id,
                guruNama: APP_STATE.currentUser.nama,
                deskripsi,
                petunjuk,
                tanggalPemberian,
                deadline,
                lampiranNama: lampiranNama || '',
                lampiranSize: lampiranSize || '',
                lampiranDataUrl: lampiranDataUrl || ''
              });
              addNotification(
                `Tugas Baru (${mapel})`,
                `${APP_STATE.currentUser.nama} mempublikasikan "${judul}" untuk kelas ${kelas}.`,
                'tugas'
              );
              saveAndSync(`Mempublikasikan tugas baru "${judul}" untuk kelas ${kelas}.`);
              showToast('Tugas Dipublikasikan!', 'Notifikasi otomatis telah dikirim ke siswa.', 'success');
            }
            APP_STATE.editingTaskId = null;
            APP_STATE.activeView = 'tugas';
            renderApp();
          };

          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => finalizeSave(file.name, formatFileSize(file.size), ev.target.result);
            reader.readAsDataURL(file);
          } else {
            finalizeSave('', '', '');
          }
        },

        editTeacherTask(tugasId) {
          APP_STATE.editingTaskId = tugasId;
          APP_STATE.activeView = 'guru_tambah_tugas';
          renderApp();
        },

        deleteTeacherTask(tugasId) {
          APP_STATE.db.tugas = APP_STATE.db.tugas.filter(t => t.id !== tugasId);
          saveAndSync(`Menghapus tugas ID ${tugasId}.`);
          showToast('Tugas Dihapus', 'Tugas telah dihapus dari daftar.', 'info');
          renderApp();
        },

        openGradeModal,
        submitGradeForm(e, subId) {
          e.preventDefault();
          const score = Number(document.getElementById('gradeScoreInput').value);
          const comment = document.getElementById('gradeCommentInput').value.trim();
          const sub = APP_STATE.db.pengumpulan.find(s => s.id === subId);
          if (sub) {
            sub.nilai = score;
            sub.komentarGuru = comment;
            addNotification(
              `Nilai Tugas Diberikan (${score}/100)`,
              `Tugas milik ${sub.siswaNama} telah dinilai oleh ${APP_STATE.currentUser.nama}.`,
              'tugas'
            );
            saveAndSync(`Memberi nilai ${score} kepada ${sub.siswaNama}.`);
            showToast('Nilai Tersimpan', `Nilai ${score} untuk ${sub.siswaNama} berhasil dikirim.`, 'success');
          }
          window.AppActions.closeModal();
          renderApp();
        },

        // Update Profil
        updateUserProfile(e) {
          e.preventDefault();
          const u = APP_STATE.currentUser;
          u.nama = document.getElementById('profNama').value.trim();
          u.noHp = document.getElementById('profHp').value.trim();
          u.email = document.getElementById('profEmail').value.trim();
          u.alamat = document.getElementById('profAlamat').value.trim();
          const idx = APP_STATE.db.users.findIndex(x => x.id === u.id);
          if (idx !== -1) APP_STATE.db.users[idx] = { ...u };
          saveAndSync('Memperbarui data profil pribadi.');
          showToast('Profil Diperbarui', 'Perubahan biodata berhasil disimpan.', 'success');
          renderApp();
        },

        // Absensi Guru
        submitAbsensiGuru(e) {
          e.preventDefault();
          const siswaId = document.getElementById('absSiswaId').value;
          const status = document.getElementById('absStatus').value;
          const ket = document.getElementById('absKet').value.trim() || 'Dicatat oleh guru';
          const siswa = APP_STATE.db.users.find(u => u.id === siswaId);
          if (!siswa) return;
          APP_STATE.db.absensi.unshift({
            id: 'abs-' + Date.now(),
            tanggal: new Date().toISOString().slice(0, 10),
            siswaId: siswa.id,
            siswaNama: siswa.nama,
            kelas: siswa.kelas,
            status,
            keterangan: ket
          });
          saveAndSync(`Mencatat absensi ${siswa.nama}: ${status}.`);
          showToast('Absensi Tersimpan', `${siswa.nama} tercatat ${status}.`, 'success');
          renderApp();
        },

        // Chatbox
        sendChatMessage(e) {
          e.preventDefault();
          const input = document.getElementById('chatInputText');
          const text = input?.value.trim();
          if (!text) return;
          const u = APP_STATE.currentUser;
          APP_STATE.db.messages.push({
            id: 'msg-' + Date.now(),
            senderId: u.id,
            senderName: `${u.nama} (${u.kelas || u.role.toUpperCase()})`,
            senderRole: u.role,
            text,
            time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB'
          });
          saveAndSync('Mengirim pesan di Chatbox.');
          renderApp();
          const box = document.getElementById('chatMessagesBox');
          if (box) box.scrollTop = box.scrollHeight;
        },

              </div>

          `;
        },
        submitNewNilai(e) {
          e.preventDefault();
          const siswa = APP_STATE.db.users.find(u => u.id === document.getElementById('nilSiswa').value);
          const skor = Number(document.getElementById('nilSkor').value);
          const predikat = skor >= 90 ? 'A' : skor >= 80 ? 'B+' : skor >= 75 ? 'B' : 'C';
          APP_STATE.db.nilaiTambahan.unshift({
            id: 'n-' + Date.now(),
            siswaId: siswa.id,
            siswaNama: siswa.nama,
            kelas: siswa.kelas,
            mapel: document.getElementById('nilMapel').value,
            jenis: document.getElementById('nilJenis').value.trim(),
            skor,
            predikat
          });

          showToast('Nilai Berhasil Diinput', 'Data nilai telah diperbarui.', 'success');

        openAddPengumumanModal() {

              <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-up">

        submitNewPengumuman(e) {

        openAddJadwalModal() {

                  </select>

          saveAndSync(`Menambahkan jadwal pelajaran ${mapel} (${hari}).`);

        deleteJadwal(id) {
          APP_STATE.db.jadwal = APP_STATE.db.jadwal.filter(j => j.id !== id);

          showToast('Jadwal Dihapus', 'Item jadwal telah dihapus.', 'info');
          renderApp();

        // Admin Akun & Akademik
        openAddUserAdminModal() {
          const modal = document.getElementById('modalRoot');
          modal.innerHTML = `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl animate-fade-up">
                <h3 class="font-extrabold text-base text-slate-800 mb-4">Tambah Akun Siswa / Guru</h3>
                <form onsubmit="window.AppActions.submitAdminNewUser(event)" class="space-y-3">
                  <select id="admRole" class="w-full rounded-xl border border-slate-200 p-3 text-xs bg-white">
                    <option value="siswa">Siswa</option>
                    <option value="guru">Guru</option>
                  </select>
                  <input id="admNama" type="text" placeholder="Nama Lengkap" class="w-full rounded-xl border border-slate-200 p-3 text-xs" required />
                  <input id="admUsername" type="text" placeholder="Username Login" class="w-full rounded-xl border border-slate-200 p-3 text-xs" required />
                  <input id="admPassword" type="text" value="123" placeholder="Password" class="w-full rounded-xl border border-slate-200 p-3 text-xs" required />
                  <input id="admExtra" type="text" placeholder="Kelas (cth: VIII-A) atau Mapel Guru" class="w-full rounded-xl border border-slate-200 p-3 text-xs" required />
                  <div class="flex gap-2 pt-2">
                    <button type="button" onclick="window.AppActions.closeModal()" class="flex-1 py-2.5 rounded-xl border text-xs font-bold">Batal</button>
                    <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Simpan Akun</button>
                  </div>
                </form>
              </div>
            </div>
          `;
        },
        submitAdminNewUser(e) {
          e.preventDefault();
          const role = document.getElementById('admRole').value;
          const nama = document.getElementById('admNama').value.trim();
          const username = document.getElementById('admUsername').value.trim().toLowerCase();
          const password = document.getElementById('admPassword').value.trim();
          const extra = document.getElementById('admExtra').value.trim();

          APP_STATE.db.users.push({
            id: 'u-' + Date.now(),
            role,
            username,
            password,
            nama,
            kelas: role === 'siswa' ? extra : undefined,
            mapel: role === 'guru' ? extra : undefined,
            nisn: role === 'siswa' ? '0099' + Math.floor(100000 + Math.random() * 900000) : undefined,
            nip: role === 'guru' ? '1989' + Math.floor(100000 + Math.random() * 900000) : undefined,
            email: `${username}@smppgrisumberagung.sch.id`,
            avatar: role === 'guru' ? AVATAR_GURU : AVATAR_SISWA
          });
          saveAndSync(`Menambahkan akun ${role} baru: ${nama}.`);
          window.AppActions.closeModal();
          showToast('Akun Berhasil Dibuat', `${nama} (${role.toUpperCase()}) siap digunakan login.`, 'success');
          renderApp();
        },
        deleteUserAccount(userId) {
          APP_STATE.db.users = APP_STATE.db.users.filter(u => u.id !== userId);
          saveAndSync(`Menghapus akun pengguna ID ${userId}.`);
          showToast('Akun Dihapus', 'Pengguna berhasil dihapus dari sistem.', 'info');
          renderApp();
        },
        addNewClass(e) {
          e.preventDefault();
          const nama = document.getElementById('newKelasNama').value.trim();
          APP_STATE.db.kelas.push({
            id: 'k-' + Date.now(),
            nama,
            waliKelas: document.getElementById('newKelasWali').value.trim(),
            jumlahSiswa: 30,
            ruang: document.getElementById('newKelasRuang').value.trim()
          });
          saveAndSync(`Menambahkan kelas baru: ${nama}.`);
          showToast('Kelas Ditambahkan', `Kelas ${nama} berhasil disimpan.`, 'success');
          renderApp();
        },
        deleteClass(id) {
          APP_STATE.db.kelas = APP_STATE.db.kelas.filter(k => k.id !== id);
          saveAndSync('Menghapus kelas.');
          renderApp();
        },
        addNewMapel(e) {
          e.preventDefault();
          const nama = document.getElementById('newMapelNama').value.trim();
          APP_STATE.db.mapel.push({
            id: 'm-' + Date.now(),
            kode: document.getElementById('newMapelKode').value.trim(),
            nama,
            guru: document.getElementById('newMapelGuru').value.trim(),
            kkm: 75
          });
          saveAndSync(`Menambahkan mata pelajaran: ${nama}.`);
          showToast('Mata Pelajaran Ditambahkan', `${nama} berhasil ditambahkan.`, 'success');
          renderApp();
        },
        saveSchoolProfile(e) {
          e.preventDefault();
          APP_STATE.db.sekolah.nama = document.getElementById('schNama').value.trim();
          APP_STATE.db.sekolah.npsn = document.getElementById('schNpsn').value.trim();
          APP_STATE.db.sekolah.kepalaSekolah = document.getElementById('schKepsek').value.trim();
          APP_STATE.db.sekolah.alamat = document.getElementById('schAlamat').value.trim();
          saveAndSync('Memperbarui identitas profil sekolah.');
          showToast('Data Sekolah Tersimpan', 'Profil SMP PGRI Sumberagung berhasil diperbarui.', 'success');
          renderApp();
        },
        async connectCustomFirebase() {
          const raw = document.getElementById('firebaseCustomConfigInput')?.value.trim();
          if (!raw) {
            showToast('Config Kosong', 'Tempelkan JSON konfigurasi Firebase terlebih dahulu.', 'warning');
            return;
          }
          try {
            const parsed = JSON.parse(raw);
            if (window.FirebaseBridge) {
              const ok = await window.FirebaseBridge.init(parsed);
              if (ok) {
                showToast('Firebase Terhubung!', 'Sinkronisasi real-time cloud aktif.', 'success');
                renderApp();
              } else {
                showToast('Gagal Terhubung', 'Periksa kembali API Key & Project ID Firebase.', 'error');
              }
            }
          } catch {
            showToast('Format JSON Tidak Valid', 'Pastikan format objek JSON Firebase benar.', 'error');
          }
        }
      };

      // Inisialisasi Tampilan Awal
      renderApp();
    })();
  </script>
